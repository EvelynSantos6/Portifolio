<!DOCTYPE html>
<html lang="pt-br">
    <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <meta name="description" content="Projeto Portifolio" />
            <meta name="author" content="Evelyn Santos" />
            <meta name="keywords" content="HTML, CSS, JavaScript" />
            <link rel="icon" type="image/svg" href="./assets/img/favicon.svg" />

            <link rel="stylesheet" href="./assets/css/style.css"> <!--Link folha de estilo da página - CSS-->

            <title>Meu Contato</title>
    </head>
    <body>
            <!-- Cabeçalho da Página (header) -->
            <header>

            <!--Div Conteudo do cabeçalho-->
            <div id="header_content" class="flex">

            <!--Titulo do Cabeçalho-->
            <div id="titulo">
                
            <!--Seu Nome-->
            <h1> Evelyn Santos</h1>

    </div>

            <!--Conteudo do Menu da Página(header)-->
            <div id="menu">

            <!--Menu da Página-->
            <nav>

                <!--Marcadores não ordenador + links-->
                <ul id="menu">
                    <li>
                        <a href="index.html"> Home </a>
                    </li>
                    <li>
                        <a href="contato.html"> Contato </a>
                    </li>
                </ul>

                </nav>
            </div>
        </div>
    </header>
            <!-- Seção Principal da Página (main) -->
            <main>
                <div id="contact" class="flex">
                    <!-- Seção Formulário de Contato-->
                    <form action="#" method="submit" id="formulario">
                        <label for="name">Nome: </label>
                        <input
                            id="name"
                            type="text"
                            name="name"
                            placeholder="Digite seu nome"
                        />
                        <span id="txtNome"></span>
    
                        <label for="email">Email: </label>
                        <input
                            id="email"
                            type="text"
                            name="email"
                            placeholder="Digite seu email"
                        />
                        <span id="txtEmail"></span>
    
                        <label for="subject">Assunto: </label>
                        <input
                            id="subject"
                            type="text"
                            name="subject"
                            placeholder="Digite o título da mensagem"
                        />
                        <span id="txtSubject"></span>
    
                        <label for="message">Mensagem: </label>
                        <textarea
                            id="message"
                            name="message"
                            placeholder="Digite sua mensagem"
                        ></textarea>
    
                        <button type="submit">Enviar</button>
                    </form>

                        <!--Seção do Google Maps-->
                        <section id="mapa" class="flex_start">
					
                            <div id="endereco">
                                <p>Av. Paulista, 694</p>
                                <p>Bela Vista - SP</p>
                            </div>
        
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.0450324887506!2d-46.65209802484233!3d-23.566826078796087!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59b8c46754f7%3A0xf92738d5e786e94!2zSXRhw7o!5e0!3m2!1spt-BR!2sbr!4v1743453931235!5m2!1spt-BR!2sbr"
                                width="500"
                                height="300"
                                frameborder="0"
                                style="border: 0"
                                allowfullscreen=""
                                aria-hidden="false"
                                tabindex="0"
                                id="mapa">
                            </iframe>
                        </section>
                </div>
            </main>

            <!-- Rodapé da Página (footer) -->
            <footer class="flex">

                <!--Seção de Contato - Redes Sociais-->
                <section id="redes_sociais">
                    <a href="">
                        <img src="assets/img/linkedin.svg" alt="LinkedIn" class="social_icon"/>
                    </a>
                    <a href="">
                        <img src="assets/img/github.svg" alt="Github" class="social_icon"/>
                    </a>
                    <a href="">
                        <img src="assets/img/instagram.svg" alt="Instagram" class="social_icon"/>
                    </a>

                </section>

                <h3>
                    Feito  com 💗 por Evelyn Santos - 2025
                </h3>

        </footer>

            <!-- Script JavaScript-->
            <script src="./assets/js/script.js"></script>

    </body>
</html>
